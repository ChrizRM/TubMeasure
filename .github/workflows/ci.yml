name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test the measurement engine
        run: swift test

      - name: Build the iOS app
        run: |
          xcodebuild build \
            -project TubMeasure.xcodeproj \
            -target TubMeasure \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO
